services:
  mongodb:
    image: mongo:8
    container_name: mongodb-8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    container_name: lms-api
    restart: always
    ports:
      - "${HOST}:${PORT}:${PORT}"
    env_file:
      - .docker.env
    depends_on:
      - mongodb
  seed:
    build: . 
    container_name: seed
    command: ["npm", "run", "db:seed"]
    restart: "no"
    depends_on:
      - api
    env_file:
      - .docker.env
volumes:
  mongodb_data:
