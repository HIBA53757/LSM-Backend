tags:
  - name: Admin Configuration
    description: Read and update application email and scheduled task settings
  - name: Admin Jobs
    description: Manually run an available background job

paths:
  /api/admin/config:
    get:
      summary: Get application configuration
      tags: [Admin Configuration]
      description: Returns the current configuration. If no configuration record exists, the default configuration is created and returned.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Application configuration.
          content:
            application/json:
              example:
                success: true
                data:
                  _id: 672a1b2c3d4e5f6789012360
                  emailsEnabled: false
                  emailDriver: log
                  inactiveDays: 7
                  inactiveReminderFrequency: '0 9 * * *'
                  trainerSummaryFrequency: '0 8 * * 1'
        '401':
          description: Missing, invalid, or expired login token.
        '403':
          description: Only admins can access application configuration.

    patch:
      summary: Update application configuration
      tags: [Admin Configuration]
      description: Admin-only. Send one or more supported fields. Cron schedule values must be valid cron expressions; emailDriver must be log or sandbox; inactiveDays must be a positive integer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              emailsEnabled: true
              emailDriver: sandbox
              inactiveDays: 10
              inactiveReminderFrequency: '0 9 * * *'
              trainerSummaryFrequency: '0 8 * * 1'
      responses:
        '200':
          description: Configuration updated.
          content:
            application/json:
              example:
                success: true
                message: Configuration updated successfully.
                data:
                  _id: 672a1b2c3d4e5f6789012360
                  emailsEnabled: true
                  emailDriver: sandbox
                  inactiveDays: 10
                  inactiveReminderFrequency: '0 9 * * *'
                  trainerSummaryFrequency: '0 8 * * 1'
        '400':
          description: No fields supplied, an unsupported field was supplied, or a value is invalid.
        '401':
          description: Missing, invalid, or expired login token.
        '403':
          description: Only admins can update application configuration.

  /api/admin/jobs/{name}/run:
    post:
      summary: Run an available background job
      tags: [Admin Jobs]
      description: Admin-only endpoint. The currently available job name is inactiveReminder. The execution is recorded as a job run.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            enum: [inactiveReminder]
          example: inactiveReminder
      responses:
        '200':
          description: Job executed successfully.
          content:
            application/json:
              example:
                success: true
                message: Job 'inactiveReminder' executed successfully.
                data:
                  jobName: inactiveReminder
                  result:
                    checked: 8
                    sent: 6
                    failed: 0
                    skipped: 2
        '400':
          description: Unknown job name.
        '401':
          description: Missing, invalid, or expired login token.
        '403':
          description: Only admins can run background jobs.
