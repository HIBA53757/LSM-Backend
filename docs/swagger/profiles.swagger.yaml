tags:
  - name: Profiles
    description: Read the authenticated user's profile

paths:
  /api/profiles/me:
    get:
      summary: Get the current user's profile
      tags: [Profiles]
      description: Returns the profile for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              example:
                success: true
                data:
                  user:
                    _id: 672a1b2c3d4e5f6789012349
                    name: Samira Learner
                    email: samira@example.com
                    role: learner
                    accountStatus: active
                    createdAt: '2026-10-28T12:00:00.000Z'
                    updatedAt: '2026-10-28T12:00:00.000Z'
        '401':
          description: Missing, invalid, or expired login token.
        '404':
          description: User profile was not found.
