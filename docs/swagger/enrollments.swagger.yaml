tags:
  - name: Enrollments
    description: Enroll in courses and manage learner enrollments

paths:
  /api/enrollments/me:
    get:
      summary: Get the current learner's enrollments
      tags: [Enrollments]
      description: Returns enrollments belonging to the authenticated learner, newest first. Each enrollment includes basic course details.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Learner enrollments.
          content:
            application/json:
              example:
                success: true
                data:
                  enrollments:
                    - _id: 672a1b2c3d4e5f6789012350
                      learner: 672a1b2c3d4e5f6789012349
                      course:
                        _id: 672a1b2c3d4e5f6789012345
                        title: JavaScript Fundamentals
                        description: Learn JavaScript basics.
                        status: published
                      status: active
                      enrolledAt: '2026-10-28T12:00:00.000Z'
        '401':
          description: Missing, invalid, or expired login token.
        '403':
          description: Only learners can access this endpoint.

  /api/enrollments/courses/{courseId}/enroll:
    post:
      summary: Enroll in a course
      tags: [Enrollments]
      description: Creates an active enrollment for the authenticated learner. The course must be published, and the learner must not already have an active enrollment in it.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
          example: 672a1b2c3d4e5f6789012345
      responses:
        '201':
          description: Enrollment created successfully.
          content:
            application/json:
              example:
                success: true
                message: Successfully enrolled in course
                data:
                  enrollment:
                    _id: 672a1b2c3d4e5f6789012350
                    learner: 672a1b2c3d4e5f6789012349
                    course: 672a1b2c3d4e5f6789012345
                    status: active
                    enrolledAt: '2026-10-28T12:00:00.000Z'
        '401':
          description: Missing, invalid, or expired login token.
        '403':
          description: Only learners can enroll in courses.
        '404':
          description: Course does not exist or is not published.
        '409':
          description: The learner already has an active enrollment in this course.

  /api/enrollments/{id}/cancel:
    patch:
      summary: Cancel an enrollment
      tags: [Enrollments]
      description: Marks the authenticated learner's enrollment as dropped. A learner can only cancel their own enrollment.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 672a1b2c3d4e5f6789012350
      responses:
        '200':
          description: Enrollment cancelled.
          content:
            application/json:
              example:
                success: true
                message: Enrollment cancelled successfully
                data:
                  enrollment:
                    _id: 672a1b2c3d4e5f6789012350
                    learner: 672a1b2c3d4e5f6789012349
                    course: 672a1b2c3d4e5f6789012345
                    status: dropped
                    enrolledAt: '2026-10-28T12:00:00.000Z'
        '401':
          description: Missing, invalid, or expired login token.
        '403':
          description: Only learners can cancel enrollments.
        '404':
          description: Enrollment was not found for the authenticated learner.
        '409':
          description: Enrollment is already cancelled.
